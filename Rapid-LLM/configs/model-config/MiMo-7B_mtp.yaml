# MiMo-7B-RL backbone dimensions, with the course's three-module MTP setup.
model_param:
  mode: LLM
  run_type: inference
  model_type: llama
  tied_embeddings: false
  global_batch_size: 1
  gradient_accumulation_steps: 1
  seq_len: 2048
  decode_len: 1024
  hidden_dim: 4096
  intermediate_size: 11008
  vocab_size: 151680
  num_layers: 36
  attention:
    attention_type: gqa
    num_heads: 32
    kv_heads: 8
    use_flashattention: false

inference_param:
  sample_every: 256
  mtp:
    guesses: 3
    modules: 3
    layers_per_module: 1
    shared_embedding_head: true
    accept_prob: [0.9, 0.8, 0.7]
